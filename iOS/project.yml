name: Compression Timer
options:
  bundleIdPrefix: com.shimondeitel.compresstimer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Compression Timer:
    type: application
    platform: iOS
    sources:
      - path: Compression Timer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.compresstimer
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Compression Timer/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  Compression TimerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Compression TimerTests
      - path: Compression Timer.storekit
    dependencies:
      - target: Compression Timer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.compresstimer.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  Compression TimerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Compression TimerUITests
    dependencies:
      - target: Compression Timer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.compresstimer.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Compression Timer:
    build:
      targets:
        Compression Timer: all
        Compression TimerTests: [test]
        Compression TimerUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Compression Timer.storekit
    test:
      config: Debug
      storeKitConfiguration: Compression Timer.storekit
      targets:
        - Compression TimerTests
        - Compression TimerUITests
    archive:
      config: Release
